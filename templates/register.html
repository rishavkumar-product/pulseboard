<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PulseBoard — Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-sm" style="width:380px">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-activity text-warning fs-1"></i>
        <h4 class="fw-bold mt-1">PulseBoard</h4>
        <p class="text-muted small">Create your account</p>
      </div>
      {% if error %}
      <div class="alert alert-danger py-2 small">{{ error }}</div>
      {% endif %}
      <form method="post" action="/auth/register">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Username</label>
          <input type="text" name="username" class="form-control" required autofocus minlength="3">
          <div class="form-text">Min 3 characters. This is your display name.</div>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" required minlength="6">
          <div class="form-text">Min 6 characters.</div>
        </div>
        <button type="submit" class="btn btn-dark w-100">Create Account</button>
      </form>
      <p class="text-center text-muted small mt-3 mb-0">
        Already have an account? <a href="/login">Sign in</a>
      </p>
    </div>
  </div>
</div>
</body>
</html>
