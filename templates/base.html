<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PulseBoard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

{% if user %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="/forums">
    <i class="bi bi-activity text-warning"></i> PulseBoard
  </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navMain">
    <ul class="navbar-nav me-auto">
    </ul>
    <ul class="navbar-nav">
      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
          <i class="bi bi-person-circle"></i> {{ user.username }}
        </a>
        <ul class="dropdown-menu dropdown-menu-end">
          {% if user.is_admin %}
          <li>
            <a class="dropdown-item" href="/admin">
              <i class="bi bi-gear me-1"></i> Admin panel
            </a>
          </li>
          <li><hr class="dropdown-divider"></li>
          {% endif %}
          <li>
            <form method="post" action="/auth/logout">
              <button type="submit" class="dropdown-item text-danger">
                <i class="bi bi-box-arrow-right"></i> Log out
              </button>
            </form>
          </li>
        </ul>
      </li>
    </ul>
  </div>
</nav>
{% endif %}

{% if flash %}
<div class="alert alert-{{ flash.type }} alert-dismissible fade show m-0 rounded-0" role="alert">
  {{ flash.message }}
  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% endif %}

<div class="container-fluid py-4">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
